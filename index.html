<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#DA291C" />
  <meta name="description" content="롯데마트·슈퍼 인재육성팀을 위한 Daily HRD Curation" />
  <title>Daily HRD | 인재육성팀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body,
    body * {
      word-break: keep-all !important;
      overflow-wrap: normal !important;
      word-wrap: normal !important;
      hyphens: none !important;
      -webkit-hyphens: none !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Daily HRD 홈">
      <span class="brand-mark">D</span>
      <span>
        <strong>DAILY HRD</strong>
        <small>인재육성팀 HRD Curation</small>
      </span>
    </a>
    <button class="share-button" id="shareBtn" type="button" aria-label="오늘의 HRD 공유">
      <span>↗</span> 공유
    </button>
  </header>

  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">매일 3분, 새로운 HRD 시야</p>
        <h1>오늘 놓치면 아쉬운<br><em>HRD 이야기 하나.</em></h1>
        <p class="hero-copy">트렌드부터 기업 사례까지, 빠르게 읽고 오래 남을 HRD를 전합니다.</p>
      </div>
      <div class="hero-meta">
        <span id="todayLabel">오늘</span>
        <span class="live-dot"></span>
        <span>Daily Curation</span>
      </div>
    </section>

    <section id="currentBriefing" class="briefing-card" aria-live="polite"></section>

    <section class="rating-card">
      <div>
        <span class="section-number">3</span>
        <div>
          <h2>오늘의 자료는 얼마나 유익했나요?</h2>
          <p>좋아하는 콘텐츠를 알수록 다음 큐레이션이 더 좋아집니다.</p>
        </div>
      </div>
      <div class="rating" id="rating" role="radiogroup" aria-label="유익도 1점에서 5점">
        <button data-value="1" aria-label="1점">1</button>
        <button data-value="2" aria-label="2점">2</button>
        <button data-value="3" aria-label="3점">3</button>
        <button data-value="4" aria-label="4점">4</button>
        <button data-value="5" aria-label="5점">5</button>
      </div>
      <p class="rating-help">1 = 아쉬워요 · 5 = 유익했어요</p>
      <p class="rating-result" id="ratingResult"></p>

      <div class="feedback-comment">
        <label for="feedbackComment">추가로 남기고 싶은 의견이 있나요? <span>(선택)</span></label>
        <textarea id="feedbackComment" maxlength="500" placeholder="좋았던 점, 더 보고 싶은 주제, 아쉬웠던 점을 자유롭게 남겨주세요."></textarea>
        <div class="feedback-comment-row">
          <p class="feedback-help">별점은 필수 · 코멘트는 선택사항입니다.</p>
          <button class="feedback-save-button" id="feedbackSaveBtn" type="button">피드백 보내기</button>
        </div>
      </div>
    </section>

    <section class="archive">
      <div class="archive-head">
        <div>
          <p class="eyebrow">ARCHIVE</p>
          <h2>지난 HRD 이야기</h2>
        </div>
        <div class="filter-wrap">
          <input id="searchInput" type="search" placeholder="키워드 검색" aria-label="아카이브 검색" />
        </div>
      </div>
      <div id="archiveList" class="archive-grid"></div>
    </section>
  </main>

  <footer>
    <p>Daily HRD · HRD Curation</p>
    <p>롯데마트·슈퍼 인재육성팀</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260901-3"></script>
</body>
</html>
