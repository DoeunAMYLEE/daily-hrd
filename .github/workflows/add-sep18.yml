name: Add Sep 18 Briefing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update briefing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/briefings.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          item = {
            "date": "2026-09-18",
            "weekday": "금",
            "category": "HRD System",
            "title": "좋은 HRD는 하루아침에 만들어지지 않는다 — 10년 데이터가 보여준 HRD의 성장",
            "summary": [
              "새로운 교육과정을 만들고, 온라인 학습 플랫폼을 도입하고, 리더십 프로그램을 개편하면 조직의 HRD는 바로 좋아질까요? 분명 의미 있는 변화입니다. 하지만 **‘좋은 교육 프로그램 하나를 만드는 것’과 ‘조직의 HRD 체계가 좋아지는 것’은 조금 다른 문제**일 수 있습니다.",
              "한국직업능력연구원이 2025년 말 발표한 KRIVET Issue Brief 312호 「공공부문 인적자원개발 우수기관 인증(Best HRD)의 성과와 발전 전략」은 이 차이를 장기간의 데이터로 보여줍니다. 연구진은 공공부문 Best HRD 인증기관을 대상으로 매년 실시한 사업평가 조사 가운데 **2016년부터 2025년까지 10년의 데이터를 분석**했습니다.",
              "Best HRD는 단순히 교육과정이 많은 기관을 선정하는 제도가 아닙니다. 능력을 중심으로 사람을 채용·관리하는 HRM(Human Resource Management)과 재직자의 학습과 성장을 지원하는 HRD(Human Resource Development)를 함께 살펴보고, 우수한 기관에는 인증을 부여하는 제도입니다. 동시에 부족한 기관에는 취약점을 확인하고 개선할 수 있도록 지원하는 것을 목적으로 해왔습니다. 공공부문에서는 2006년부터 시행돼 2025년에 20주년을 맞았습니다.",
              "10년의 데이터를 놓고 봤을 때 가장 먼저 확인되는 것은 **인증사업에 대한 전반적인 만족도가 시간이 지나면서 상승했다는 것**입니다. 그러나 더 흥미로운 결과는 ‘어떤 효과가 먼저 나타났는가’를 살펴봤을 때 드러납니다.",
              "Best HRD 참여에 따른 효과 가운데 비교적 빠르게 높은 평가를 받은 것은 **제도와 체계를 개선하는 효과**, 그리고 조직 내부와 외부에 인재개발에 대한 관심과 이미지를 높이는 효과였습니다. 반면 **인적·물적 자원에 대한 투자 효과는 상대적으로 천천히 나타났습니다.**",
              "이 결과는 HRD를 바꿀 때 무엇이 먼저 달라지는지를 생각하게 합니다. 예를 들어 조직이 인재육성체계를 새롭게 정비한다고 해보겠습니다. 교육체계를 분류하고, 직급별 프로그램을 만들고, 신청과 운영 프로세스를 표준화하고, 담당 역할을 명확히 하는 것은 비교적 빠르게 시작할 수 있습니다. 구성원에게도 ‘회사가 인재육성을 체계적으로 관리하기 시작했다’는 변화가 눈에 보일 수 있습니다.",
              "하지만 **HRD 전담인력을 충분히 확보하고, 지속적인 예산을 마련하고, 구성원이 실제 학습할 시간을 확보하며, 현업 관리자까지 육성에 참여하도록 만드는 변화는 훨씬 긴 시간이 필요할 수 있습니다.** 즉 HRD의 변화는 한 번에 완성되기보다 눈에 보이는 제도부터 만들어지고, 그 제도가 실제 사람·예산·행동으로 뿌리내리는 데 시간이 걸리는 과정일 수 있다는 것입니다.",
              "10년 동안 조직들이 느낀 ‘어려움’의 변화도 이를 잘 보여줍니다. 연구에 따르면 Best HRD에 참여하는 과정에서 느꼈던 여러 어려움은 시간이 지나면서 대체로 완화됐습니다. 연구진은 그 배경으로 **HRD·HRM에 대한 조직의 인식이 높아지고, 제도에 대한 이해와 경험이 축적된 것**을 제시합니다. 처음에는 무엇을 어떻게 갖춰야 하는지 자체가 어려웠지만, 시간이 지나면서 조직 안에 관련 지식과 경험이 쌓인 것입니다.",
              "그런데 모든 문제가 시간과 함께 사라진 것은 아니었습니다. 계속해서 어려움으로 남아 있었던 대표적인 항목이 **인력 부족**이었습니다. HRD의 필요성을 알고 제도에 대한 이해가 높아져도, 실제로 이를 기획하고 운영하고 개선할 사람이 충분하지 않다면 실행의 한계는 계속 존재할 수 있다는 의미입니다.",
              "이 부분은 HRD를 바라보는 관점에서도 중요합니다. 조직에서 HRD를 발전시키려고 할 때 우리는 흔히 새로운 리더십 과정, AI 교육, 직무 Academy, 온라인 Learning Platform처럼 새로운 프로그램부터 떠올립니다. 물론 모두 필요할 수 있습니다. 하지만 HRD가 조직 안에서 지속되려면 프로그램 외에도 **누가 이것을 운영할 것인지, 어떤 예산과 시간을 확보할 것인지, 현업과 어떻게 연결할 것인지, 결과를 어떻게 확인하고 개선할 것인지**가 함께 만들어져야 합니다.",
              "그래서 ‘좋은 HRD’를 판단할 때 질문도 달라질 수 있습니다. **‘좋은 교육 프로그램이 있는가?’**뿐 아니라, **‘좋은 교육이 계속 만들어지고, 실행되고, 개선될 수 있는 구조가 있는가?’**를 함께 보는 것입니다.",
              "한국직업능력연구원이 앞으로의 Best HRD 발전방향으로 **기관의 HRD·HRM 역량 성장을 유도할 수 있는 단계별 인증기준**을 제안한 것도 이와 연결됩니다. 모든 조직이 같은 상태에 있는 것이 아니라, 현재 구축된 수준에 따라 다음 단계로 성장할 수 있도록 접근할 필요가 있다는 것입니다. 연구진은 이와 함께 인증 준비 부담 완화, 다른 정책과 연계한 혜택 확대, Best HRD의 사회적 위상 강화 등도 향후 과제로 제안했습니다.",
              "HRD 실무에서는 이러한 성장을 Build에서 필요한 제도와 교육체계를 만들고 → Embed에서 이를 실제 업무와 조직의 운영방식에 연결하고 → Sustain에서 사람·시간·예산 등 지속할 수 있는 자원을 확보하고 → Evolve에서 결과를 확인하면서 계속 수정하고 발전시키는 흐름으로 생각해볼 수 있습니다. **Build → Embed → Sustain → Evolve**는 한국직업능력연구원이 공식적으로 제시한 Best HRD 성장모델이 아니라, 10년간 나타난 제도·체계 개선, 인식 변화, 자원 투자, 지속적인 역량 성장이라는 결과를 HRD 관점에서 이해하기 쉽게 구조화한 흐름입니다.",
              "물론 이번 연구는 **공공부문 Best HRD 인증기관의 사업평가 자료**를 분석한 것이므로 결과를 일반 기업의 HRD에 그대로 적용할 수는 없습니다. 또한 인증제도 참여에 대한 인식과 효과를 분석한 자료이지, 특정 HRD 제도가 기업성과를 얼마나 높였는지를 실험적으로 검증한 연구도 아닙니다.",
              "그럼에도 10년이라는 시간축에서 반복적으로 나타난 변화는 하나의 중요한 시사점을 줍니다. **HRD의 성장은 새로운 교육 하나가 생기는 순간보다, 조직이 사람의 성장을 지원하는 방식을 계속 만들고 운영하고 개선하는 과정에 더 가깝다**는 것입니다.",
              "제도는 비교적 빨리 만들 수 있습니다. 하지만 구성원이 학습을 당연하게 여기고, 관리자가 사람의 성장을 자신의 역할로 받아들이고, HRD가 사업과 연결되며, 필요한 자원이 꾸준히 투입되는 상태는 시간이 쌓여야 만들어질 수 있습니다. 그래서 HRD를 고도화할 때는 ‘올해 어떤 새로운 교육을 만들 것인가?’와 함께 **‘우리 조직의 HRD는 작년보다 어떤 부분에서 한 단계 더 성장했는가?’**를 물어볼 수 있습니다. 좋은 HRD는 완성된 하나의 프로그램이 아니라, **조직과 함께 계속 성장하는 하나의 체계**일 수 있습니다."
            ],
            "bite_term": "HRD Maturity",
            "bite_definition": "HRD Maturity는 조직의 인재육성이 얼마나 체계적으로 자리 잡고 지속적으로 작동하고 있는지를 바라보는 관점입니다. 교육과정의 개수가 많다고 반드시 HRD Maturity가 높은 것은 아닙니다. 실무적으로는 Program → System으로 개별 교육에서 연결된 육성체계로, Event → Continuous로 한 번의 교육에서 지속적인 학습으로, HRD Only → Shared Responsibility로 HRD 담당자만의 일에서 관리자·현업이 함께하는 육성으로, Operation → Improvement로 교육 운영에서 결과를 확인하고 계속 개선하는 구조로 발전하는 모습으로 이해할 수 있습니다. 다만 HRD Maturity에는 모든 기관이 공통으로 사용하는 하나의 공식 단계모델이 있는 것은 아니며, 이번 글에서는 HRD가 단발적인 활동에서 지속 가능한 조직의 체계로 발전해가는 정도를 설명하는 개념으로 사용했습니다.",
            "bite_line": "좋은 HRD는 좋은 교육 하나를 만드는 것이 아니라, 좋은 학습이 계속 만들어질 수 있는 조직을 만드는 것입니다.",
            "source_name": "한국직업능력연구원",
            "source_title": "KRIVET Issue Brief 312호 — 공공부문 인적자원개발 우수기관 인증(Best HRD)의 성과와 발전 전략",
            "source_url": "https://www.krivet.re.kr/kor/sub.do?menuSn=14&pstNo=PB0000000644",
            "sources": [
              {
                "name": "한국직업능력연구원",
                "title": "KRIVET Issue Brief 312호 — 공공부문 인적자원개발 우수기관 인증(Best HRD)의 성과와 발전 전략",
                "url": "https://www.krivet.re.kr/kor/sub.do?menuSn=14&pstNo=PB0000000644"
              },
              {
                "name": "한국직업능력연구원",
                "title": "2025년 공공부문 인적자원개발 우수기관 인증(Best HRD) 사업",
                "url": "https://www.krivet.re.kr/kor/sub.do?menuSn=12&pstNo=PB0000000683"
              }
            ],
            "tags": ["HRD System", "HRD Maturity", "Best HRD", "인재육성체계"]
          }

          data = [x for x in data if x.get('date') != item['date']]
          data.append(item)
          data.sort(key=lambda x: x['date'])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "daily-hrd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefings.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Sep 18 HRD Maturity briefing"
          git push
