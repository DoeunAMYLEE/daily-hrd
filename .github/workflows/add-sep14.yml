name: Add Sep 14 Briefing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update briefing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/briefings.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          item = {
            "date": "2026-09-14",
            "weekday": "월",
            "category": "Learning Design",
            "title": "아는 것과 잘하는 것은 다르다 — Soft Skill을 만드는 기업교육의 조건",
            "summary": [
              "커뮤니케이션 교육을 들으면 커뮤니케이션을 잘하게 될까요? 협업의 원칙을 배우면 실제 협업도 자연스럽게 좋아질까요? 기업교육에서는 의사소통, 협업, 문제해결, 적응력, 리더십처럼 다양한 역량을 교육합니다. 그런데 이런 역량에는 한 가지 특징이 있습니다. **내용을 ‘아는 것’만으로 실제 행동이 달라졌다고 보기 어렵다는 것**입니다.",
              "한국직업능력연구원이 발행하는 「직업능력개발연구」에 2025년 게재된 「기업교육 소프트 스킬 강화를 위한 적응형 학습 플랫폼 분석 및 개선 방안 연구」는 바로 이 문제를 다뤘습니다. 연구진은 기업교육에서 의사소통, 협업 능력, 문제해결 능력, 적응력, 리더십 등을 Soft Skill의 대표적인 예로 보고, 이러한 역량을 디지털 학습환경에서 효과적으로 개발하려면 무엇이 필요한지 분석했습니다.",
              "연구가 흥미로운 이유는 온라인 교육의 장단점을 단순히 비교하지 않았다는 점입니다. 연구진은 먼저 선행연구와 실제 오프라인 기업교육 사례를 검토하고, 이를 바탕으로 **학습 전·학습 중·학습 후에 어떤 교수설계 요소가 필요한지를 정리한 분석틀**을 만들었습니다. 이후 실제 기업교육에 사용되는 대표적인 적응형 학습 플랫폼 사례를 이 기준으로 분석했습니다.",
              "첫 번째로 확인된 보완 영역은 **‘심층적 상호작용’**입니다. 커뮤니케이션이나 협업은 좋은 방법에 대한 설명을 읽고 문제를 맞히는 것과, 실제 상대방과 의견을 주고받으며 내 표현을 조정하는 것이 다른 경험입니다. 연구에서도 Soft Skill 학습을 위해서는 단순한 콘텐츠 제공을 넘어 **학습자 간 또는 학습자와 교수자 사이에서 깊이 있는 상호작용이 일어날 수 있는 지원**이 필요하다고 봤습니다.",
              "두 번째는 **‘실무 기반 실습’**입니다. 문제해결이나 리더십 역시 개념을 이해하는 것만으로 완성되기 어렵습니다. 실제 업무와 비슷한 상황에서 판단하고, 선택하고, 행동해보는 과정이 필요합니다. 연구에서는 분석 대상 플랫폼이 이런 **실제 업무 맥락과 연결된 Practice를 충분히 지원하는 데 한계**가 있다고 지적했고, Soft Skill을 개발하려면 학습과정 안에서 실습과 실제 적용 경험을 강화해야 한다고 제안합니다.",
              "예를 들어 ‘좋은 피드백의 원칙’을 배우는 교육이 있다고 해봅시다. 핵심 원칙 다섯 가지를 영상으로 보고 퀴즈를 맞히면 관련 지식은 확인할 수 있습니다. 하지만 실제 Skill을 연습하려면 상대가 성과를 내지 못한 상황에서 내가 직접 피드백을 구성해보고 → 상대방의 반응이나 피드백을 받고 → 어떤 표현이 효과적이었는지 돌아본 뒤 → 다른 상황에서 다시 시도하는 경험이 필요합니다. 이 예시는 연구에서 제시한 공식 프로그램이 아니라, **연구가 강조한 상호작용·실습 원칙을 기업교육 상황에 적용해본 예시**입니다.",
              "세 번째는 **‘평가와 성찰’**입니다. Soft Skill은 정답과 오답만으로 평가하기 어려운 경우가 많습니다. 문제해결 과정에서 왜 그런 판단을 했는지, 다른 선택지는 없었는지, 실제 대화에서 내 행동은 어떠했는지를 돌아보는 과정이 중요합니다. 연구 역시 분석한 플랫폼에서 **체계적인 평가와 Reflection을 지원하는 기능이 충분하지 않았다**고 봤습니다. 따라서 ‘정답을 알고 있는가?’뿐 아니라 ‘실제로 어떻게 행동했는가?’, ‘왜 그렇게 행동했는가?’, ‘다음에는 무엇을 다르게 할 것인가?’까지 확인할 필요가 있습니다.",
              "네 번째는 **‘학습 이후의 적용 지원’**입니다. 기업교육에서 Soft Skill을 배우는 궁극적인 목적은 교육 플랫폼 안에서 높은 점수를 받는 것이 아니라 실제 업무에서 행동이 달라지는 것입니다. 연구에서도 학습 이후 업무에 배운 내용을 적용하도록 돕는 **Transfer 지원이 충분하지 않은 영역 중 하나**로 확인됐으며, 플랫폼이 실습뿐 아니라 실제 업무 적용까지 지원할 수 있도록 개선될 필요가 있다고 제안했습니다.",
              "이 네 가지 결과를 함께 보면 기업교육에서 모든 Skill을 동일한 방식으로 가르칠 수 있는 것은 아닐 수 있습니다. 새로운 시스템의 메뉴 위치나 업무규정처럼 명확한 지식은 설명하고 확인하는 방식만으로도 일정 부분 학습할 수 있습니다. 하지만 커뮤니케이션, 협업, 리더십처럼 **상황에 따라 판단하고 다른 사람과 상호작용하면서 나타나는 역량은 ‘설명 → 이해 → 시험’만으로 개발하기 어렵습니다.**",
              "이런 Soft Skill에는 좋은 행동의 기준과 원리를 이해하는 Understand → 실제와 비슷한 상황에서 직접 행동해보는 Practice → 다른 사람과 상호작용하며 반응을 경험하는 Interact → 자신의 행동을 돌아보는 Reflect → 실제 업무에서 다시 활용해보는 Apply와 같은 학습경험이 중요할 수 있습니다. 이 다섯 단계는 논문에서 공식적으로 제시한 모델이 아니라, 연구에서 강조한 상호작용·실습·성찰·전이 지원의 의미를 **HRD 실무 관점에서 이해하기 쉽게 구조화한 흐름**입니다.",
              "물론 이번 연구가 모든 온라인 Soft Skill 교육이 효과적이지 않다고 결론 내린 것은 아닙니다. 특정 기업교육용 적응형 학습 플랫폼 사례를 분석해 현재 어떤 지원이 부족한지를 살펴본 연구이므로, 모든 온라인 교육방식에 결과를 그대로 일반화해서는 안 됩니다. 오히려 연구의 메시지는 **‘Soft Skill은 온라인으로 가르칠 수 없다’가 아니라, Soft Skill의 특성에 맞게 디지털 학습환경도 다르게 설계해야 한다**는 쪽에 가깝습니다.",
              "AI와 디지털 학습이 발전하면 이런 설계의 가능성은 오히려 더 넓어질 수도 있습니다. 상황 기반 Simulation, AI와의 Role Play, 즉각적인 Feedback, 동료 간 Practice처럼 과거 온라인 콘텐츠에서는 구현하기 어려웠던 경험들을 디지털 환경에서도 제공할 수 있기 때문입니다. 중요한 것은 기술 자체보다 **그 기술이 학습자에게 어떤 행동을 해보게 만드는가**입니다.",
              "결국 Soft Skill 교육을 기획할 때는 ‘무엇을 알려줄 것인가?’만으로는 부족할 수 있습니다. **‘학습자가 무엇을 직접 해보게 할 것인가?’**, 그리고 **‘그 행동에 대해 어떤 피드백을 받고, 어떻게 다시 시도하게 할 것인가?’**까지 설계할 때 지식 전달을 넘어 실제 Skill 개발에 가까워질 수 있습니다."
            ],
            "bite_term": "Soft Skills",
            "bite_definition": "업무를 수행하면서 다른 사람과 소통하고, 협력하고, 문제를 해결하고, 변화하는 상황에 적응하는 과정에서 나타나는 행동적·사회적 역량을 의미합니다. 대표적으로 Communication, Collaboration, Problem Solving, Adaptability, Leadership 등이 포함됩니다. Soft Skill의 특징은 ‘알고 있다’와 ‘할 수 있다’ 사이에 거리가 존재할 수 있다는 점입니다. 그래서 Know에서 원리와 기준을 알고, Try에서 직접 행동해보고, Feedback을 받은 뒤, Reflect에서 자신의 행동을 돌아보고, Try Again으로 다른 상황에서 다시 시도하는 경험이 중요합니다. Know → Try → Feedback → Reflect → Try Again은 특정 기관의 공식 Soft Skill 모델이 아니라 이번 개념을 이해하기 위한 실무적 흐름입니다.",
            "bite_line": "Soft Skill은 무엇을 아는가보다, 실제 상황에서 어떻게 행동하는가에 더 가깝습니다.",
            "source_name": "한국직업능력연구원",
            "source_title": "기업교육 소프트 스킬 강화를 위한 적응형 학습 플랫폼 분석 및 개선 방안 연구",
            "source_url": "https://www.krivet.re.kr/kor/sub.do?menuSn=12&pstNo=PB0000000566",
            "tags": ["Learning Design", "Soft Skills", "기업교육", "Practice"]
          }

          data = [x for x in data if x.get('date') != item['date']]
          data.append(item)
          data.sort(key=lambda x: x['date'])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "daily-hrd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefings.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Sep 14 Soft Skills briefing"
          git push
