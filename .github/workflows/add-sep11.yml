name: Add Sep 11 Briefing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update briefing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/briefings.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          item = {
            "date": "2026-09-11",
            "weekday": "금",
            "category": "국내 HRD",
            "title": "교육은 잘 운영하는데, 왜 효과는 증명하기 어려울까? — 한국 기업 HRD의 ‘기획·평가’ 공백",
            "summary": [
              "교육 일정 수립, 강사 섭외, 교육장 준비, 참석자 안내, 과정 운영. 기업교육을 담당하다 보면 실제 업무시간의 상당 부분이 교육을 문제없이 실행하는 데 사용됩니다. 그런데 교육을 **‘잘 운영하는 것’과 ‘좋은 교육을 만드는 것’은 같은 의미일까요?** 최근 국내 기업 교육담당자들을 조사한 결과를 보면, 기업 HRD가 상대적으로 잘하고 있는 영역과 더 보완이 필요한 영역 사이에 꽤 선명한 차이가 나타났습니다.",
              "한국직업능력연구원은 2026년 4월 KRIVET Issue Brief 318호 「기업교육의 사각지대: ‘기획’과 ‘평가’에서 가장 큰 개선 격차 발견」을 발표했습니다. 연구진은 인적자본기업패널(HCCP)에 참여한 **166개 기업의 교육담당자를 대상으로 기업교육 활동 37개**에 대해 조사했습니다. 각각의 활동을 얼마나 중요하게 생각하는지, 그리고 현재 회사에서는 어느 정도 실행하고 있는지를 비교해 개선이 필요한 영역을 분석했습니다.",
              "연구에서 기업교육 활동은 크게 **기획 및 설계, 운영 준비, 운영, 현업 적용 촉진, 평가 및 개선**의 다섯 영역으로 나뉩니다. 흥미로운 점은 교육담당자들이 기획과 평가를 중요하다고 생각하면서도, 실제로 상대적으로 잘 수행하고 있다고 인식한 영역은 운영 준비와 운영이었다는 것입니다. 즉 **중요하다고 생각하는 일과 실제로 익숙하게 수행하는 일 사이에 차이가 존재**했습니다.",
              "그 차이가 가장 크게 나타난 곳은 **‘평가 및 개선’**이었습니다. 중요도와 현재 실행 수준의 차이를 반영한 수행요구도는 평가 및 개선이 **1.776점으로 다섯 영역 중 가장 높았고**, 기획 및 설계 1.647점, 운영 1.503점, 현업 적용 촉진 1.452점, 운영 준비 1.298점 순으로 나타났습니다. 교육을 실제로 실행하는 과정보다 **교육의 앞단을 설계하고, 끝난 뒤 효과를 확인하는 영역에서 더 큰 개선 필요를 느끼고 있었던 것**입니다.",
              "특히 연구에서 선정된 **최우선 개선 활동 5개 가운데 3개가 교육이 시작되기 전 단계**에 포함됐습니다. 과정이 시작된 뒤 어떻게 잘 운영할 것인가보다, 그 전에 어떤 문제가 있는지 파악하고 교육의 목표와 방향을 제대로 설정하는 일이 더 시급한 개선과제로 나타난 것입니다. 한국직업능력연구원 역시 교육훈련 기획 단계에서 기업의 **경영 상황과 교육을 연결하는 것을 출발점으로 삼아야 한다**고 제안했습니다.",
              "예를 들어 ‘점장 리더십 교육’을 만든다고 생각해볼 수 있습니다. 운영 관점에서는 좋은 강사를 선정하고, 사례와 실습을 준비하고, 참가자를 안내하고, 교육 당일 문제가 발생하지 않도록 관리하는 일이 중요합니다. 하지만 그보다 앞서 **‘현재 점장의 어떤 행동이 달라져야 하는가?’, ‘그 행동은 어떤 조직·사업 문제와 연결되어 있는가?’, ‘교육 이후 무엇이 바뀌면 성공이라고 볼 것인가?’**를 정의해야 교육의 방향이 명확해집니다.",
              "이 질문이 중요한 이유는 기획과 평가가 사실 서로 떨어진 일이 아니기 때문입니다. 교육을 만들 때 무엇을 변화시키려고 하는지 명확하게 정했다면 교육이 끝난 뒤에도 그 변화를 기준으로 효과를 확인할 수 있습니다. 반대로 목표가 ‘리더십을 강화한다’, ‘직무역량을 높인다’ 정도로만 정의돼 있다면 과정이 끝난 뒤에도 만족도나 수료율 이외에 **무엇을 평가해야 하는지 모호해질 가능성**이 커집니다.",
              "연구에서 또 하나 눈여겨볼 결과는 **현업 적용 촉진**입니다. 현업 적용 촉진은 다섯 영역 가운데 실제 실행 수준이 가장 낮았지만, 개선 요구도는 상대적으로 높지 않았습니다. 연구진은 이 결과를 두고 **현업 적용의 중요성이 과소평가되고 있을 가능성**을 지적했습니다. 즉 교육을 제공하는 것까지는 HRD의 역할로 명확하게 인식하지만, 구성원이 배운 내용을 현장에서 실제로 사용할 수 있도록 돕는 일은 상대적으로 덜 중요하게 인식되고 있을 수 있다는 것입니다.",
              "교육담당자의 역할을 교육 당일까지로 본다면, 과정이 끝난 순간 HRD의 업무도 끝날 수 있습니다. 하지만 교육의 목적을 실제 구성원의 변화와 조직의 성과까지로 확장한다면 교육 이후에도 확인해야 할 것이 생깁니다. 배운 내용을 실제 업무에서 사용했는지, 적용을 어렵게 만드는 환경은 없었는지, 교육내용 가운데 무엇이 도움이 됐고 무엇을 수정해야 하는지 다시 확인하는 과정입니다.",
              "한국직업능력연구원의 제안 역시 같은 방향입니다. 연구진은 기업교육의 효과를 높이기 위해 **교육훈련 기획 단계에서 경영 상황과 연계하고, 교육이 성과로 이어질 수 있도록 환류 체계를 구축하며, 현업 적용을 촉진할 수 있는 보상·인정 체계도 고려할 필요가 있다**고 설명합니다. 결국 좋은 기업교육은 교육 당일의 완성도만으로 만들어지는 것이 아니라 앞의 기획과 뒤의 평가·적용이 함께 연결될 때 완성된다는 의미입니다.",
              "이를 기업교육의 전체 흐름으로 보면 기획 및 설계에서 왜 필요한지와 무엇을 변화시킬지 정의하고, 운영 준비에서 강사·콘텐츠·학습환경을 준비한 뒤, 운영에서 실제 학습경험을 제공합니다. 이후 현업 적용 촉진을 통해 배운 것을 업무에서 활용할 수 있도록 지원하고, 평가 및 개선에서 결과를 확인해 다음 교육에 반영하는 흐름으로 이해할 수 있습니다. 이 다섯 영역은 실제 이번 KRIVET 연구에서 기업교육 활동을 분석할 때 사용한 구분입니다.",
              "이번 조사에서 중요한 메시지는 기업의 교육담당자가 교육 운영을 잘못하고 있다는 것이 아닙니다. 오히려 **이미 익숙하게 수행하고 있는 ‘교육을 실행하는 역량’에 더해, 교육의 시작을 설계하고 결과를 확인하는 역량까지 HRD의 전문성을 확장할 필요가 있다는 것**에 가깝습니다. 교육 시작일을 기준으로 HRD 업무가 시작되고, 교육 종료일을 기준으로 업무가 끝난다면 교육에서 가장 중요한 앞과 뒤가 비어버릴 수도 있습니다. 그래서 다음 교육을 준비할 때는 ‘이 교육을 어떻게 잘 운영할까?’와 함께, **‘이 교육은 왜 시작됐고, 끝난 뒤 무엇이 달라져야 하는가?’**를 먼저 물어볼 필요가 있습니다."
            ],
            "bite_term": "Training Lifecycle",
            "bite_definition": "기업교육을 교육 당일 하나의 이벤트가 아니라, 필요를 발견하고 교육을 설계하는 순간부터 현업 적용과 평가·개선까지 이어지는 전체 과정으로 바라보는 관점입니다. 실무적으로는 Plan에서 왜 교육이 필요한지와 목표를 정의하고, Prepare에서 콘텐츠·강사·학습환경을 준비한 뒤, Deliver에서 교육을 실행합니다. 이후 Apply에서 배운 내용을 현업에서 사용할 수 있도록 지원하고, Evaluate & Improve에서 교육의 결과를 확인해 다음 과정에 반영합니다. 이번 KRIVET 연구에서도 기업교육을 기획 및 설계 → 운영 준비 → 운영 → 현업 적용 촉진 → 평가 및 개선의 다섯 영역으로 구분했습니다. Plan → Prepare → Deliver → Apply → Evaluate & Improve는 KRIVET이 공식적으로 명명한 영문 5단계 모델이 아니라, 이번 Daily HRD에서 Training Lifecycle을 쉽게 이해하기 위해 정리한 표현입니다.",
            "bite_line": "교육 당일을 잘 운영하는 것만큼, 교육의 시작과 끝을 설계하는 것도 중요합니다.",
            "source_name": "한국직업능력연구원",
            "source_title": "KRIVET Issue Brief 318호 — 기업교육의 사각지대: ‘기획’과 ‘평가’에서 가장 큰 개선 격차 발견",
            "source_url": "https://www.krivet.re.kr/kor/sub.do?menuSn=14&pstNo=PB0000000811",
            "tags": ["국내 HRD", "Training Lifecycle", "교육기획", "교육평가"]
          }

          data = [x for x in data if x.get('date') != item['date']]
          data.append(item)
          data.sort(key=lambda x: x['date'])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "daily-hrd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefings.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Sep 11 KRIVET briefing"
          git push
