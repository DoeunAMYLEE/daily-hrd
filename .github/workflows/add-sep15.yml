name: Add Sep 15 Briefing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update briefing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/briefings.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          item = {
            "date": "2026-09-15",
            "weekday": "화",
            "category": "Career Development",
            "title": "사람들은 왜 배우려고 할까? — 학습과 커리어 성장을 연결하는 HRD",
            "summary": [
              "회사가 새로운 교육과정을 열었습니다. 내용도 좋고 강사도 훌륭합니다. 그런데 구성원 입장에서는 한 가지 질문이 남을 수 있습니다. **‘그래서 이걸 배우면 나에게 무엇이 달라질까?’** 기업교육에서는 어떤 Skill을 가르칠지, 어떤 과정을 만들지에 많은 시간을 씁니다. 하지만 구성원이 학습을 선택하는 이유는 교육과정 그 자체와 조금 다를 수 있습니다. LinkedIn의 「2025 Workplace Learning Report」는 **Career Progress, 즉 자신의 커리어가 앞으로 나아간다는 감각이 사람들이 학습하려는 가장 큰 동기**라고 설명합니다.",
              "이 보고서는 전 세계 **L&D·HR 담당자 937명과 학습자 679명**을 조사하고, LinkedIn의 플랫폼 데이터를 함께 분석했습니다. 조사에서 L&D 담당자의 49%는 경영진이 ‘구성원에게 사업전략 실행에 필요한 Skill이 부족하다’고 우려하고 있다고 답했습니다. 기업에는 빠르게 새로운 Skill이 필요한데, 그 Skill을 실제로 배우는 구성원에게도 학습할 이유가 필요하다는 것이 이번 보고서의 출발점입니다.",
              "LinkedIn은 기업들의 Career Development 수준을 비교해 가장 성숙한 집단을 **‘Career Development Champions’**라고 분류했습니다. 전체 조사기업 가운데 여기에 해당한 조직은 **36%**였습니다. 31%는 Career Development 프로그램은 있지만 활용이 제한적이었고, 나머지 33%는 관련 제도가 없거나 이제 막 시작하는 단계였습니다.",
              "여기서 말하는 Career Development는 단순히 승진교육을 의미하지 않습니다. 실제 조사에서 기업들이 운영하는 방식은 Leadership Training 71%, 사내 채용공고 공유 59%, Career Development Plan 55%, Mentoring 55%, Cross-functional Project 45%, Internal Mobility Program 44%, Continuing Education 지원 41%, Peer Learning Group 31%, Job Rotation 26% 등이 포함됐습니다. 즉 구성원의 성장을 **‘교육과정을 듣는 것’ 하나로만 만들지 않는다는 것**입니다.",
              "새로운 지식을 배우는 교육도 있고, 다른 사람에게 Coaching이나 Mentoring을 받는 경험도 있고, 새로운 프로젝트에 참여하거나 다른 직무로 이동하며 Skill을 사용하는 경험도 있습니다. Career Development가 잘 작동하는 조직에서는 이런 경험들이 서로 연결되면서 **‘무엇을 배워야 하는가?’와 ‘어디로 성장할 수 있는가?’가 하나의 이야기**가 됩니다.",
              "예를 들어 데이터 분석 교육을 제공한다고 생각해볼 수 있습니다. 단순히 ‘데이터 분석 과정이 개설됐습니다’라고 안내하는 것과, ‘이 Skill은 향후 어떤 업무와 역할에서 활용되고, 어느 수준까지 개발하면 어떤 프로젝트나 직무기회에 도전할 수 있습니다’라고 보여주는 것은 학습자에게 전혀 다른 의미가 될 수 있습니다. 교육과 커리어가 연결되면 학습은 회사가 요구하는 또 하나의 과정이 아니라 **내가 다음 역할로 이동하기 위해 필요한 준비**로 받아들여질 가능성이 커집니다.",
              "실제 LinkedIn의 플랫폼 분석에서도 Career Development Index가 높은 기업은 낮은 기업보다 **학습에 참여하는 구성원, 전체 승진율, 리더 직책으로의 승진율이 더 높은 경향**을 보였습니다. 이 지표는 내부 이동 수준, 리더십 Skill 개발, Career Growth에 대한 회사의 Commitment, 채용공고에서의 Career Development 언급 등을 종합해 만들어졌습니다.",
              "조직 측면의 차이도 나타났습니다. Career Development Champions 가운데 **회사의 수익성에 자신 있다고 답한 비율은 75%**로 다른 조직의 64%보다 높았습니다. 우수인재를 확보할 수 있다는 자신감은 71% 대 58%, 인재를 유지할 수 있다는 자신감은 **67% 대 50%**였습니다. 생성형 AI 도입에서도 Accelerating 또는 Leading 단계라고 답한 비율이 **51% 대 36%**로 차이가 났습니다.",
              "다만 이 숫자를 ‘Career Development를 하면 수익성과 AI 활용이 높아진다’는 인과관계로 해석해서는 안 됩니다. 이번 보고서는 설문과 LinkedIn 플랫폼 데이터를 활용해 **Career Development가 성숙한 조직과 여러 긍정적 지표 사이의 연관성**을 보여준 자료입니다. 성과가 좋은 회사가 인재개발에도 더 많은 자원을 투자했을 가능성처럼 다른 요인도 존재할 수 있습니다.",
              "그럼에도 한 가지 패턴은 흥미롭습니다. Career Development Champions는 그렇지 않은 조직보다 **Career Development 활동을 최소 33% 더 다양하게 활용**했고, 이들 중 83%는 해당 연도에도 Career-driven Learning에 대한 투자를 유지하거나 확대할 계획이라고 답했습니다. 핵심은 교육비를 많이 쓰는 것보다 **학습을 다양한 성장기회와 연결하는 것**에 가깝습니다.",
              "실제로 Internal Mobility를 예로 보면 Career Development Champions의 **44%가 내부이동 프로그램을 운영**한 반면 다른 조직은 24%였고, 55%는 앞으로 Internal Mobility를 더 중요한 우선순위로 보고 있었습니다. 구성원이 새로운 Skill을 배운 뒤 그 Skill을 사용할 역할이나 프로젝트가 조직 안에 존재해야 학습과 커리어가 실제로 연결될 수 있기 때문입니다.",
              "HRD가 Career Development와 연결되기 위해서는 과정의 앞뒤에 몇 가지 질문이 추가될 수 있습니다. Goal에서 구성원은 어떤 역할과 성장을 원하는지 살펴보고, Skill에서 그 역할에 어떤 Skill이 필요한지 확인한 뒤, Learning에서 어떤 학습으로 Skill을 개발할지 정할 수 있습니다. 이후 Experience에서 어떤 프로젝트·Coaching·Mentoring에서 직접 사용해볼지 연결하고, Opportunity에서 개발한 Skill을 어떤 새로운 역할이나 커리어 기회와 연결할지 살펴보는 방식입니다. **Goal → Skill → Learning → Experience → Opportunity**는 LinkedIn이 공식적으로 제시한 Career Development 모델이 아니라, 이번 보고서의 내용을 HRD 실무에서 이해하기 쉽게 구조화한 흐름입니다.",
              "여기서 특히 중요한 것은 마지막 Opportunity입니다. 교육을 많이 제공해도 구성원에게 ‘배운 뒤에 달라지는 것이 없다’는 느낌이 반복된다면 학습은 점차 하나의 이수과제가 될 수 있습니다. 반대로 새로운 Skill을 익힌 사람이 프로젝트에 참여하고, 다른 업무를 경험하고, 다음 역할에 도전하는 모습을 볼 수 있다면 **학습 자체가 커리어를 움직이는 수단**으로 인식될 수 있습니다.",
              "LinkedIn 조사에서도 **L&D 담당자의 91%가 지속적인 학습이 커리어 성공에 그 어느 때보다 중요해졌다고 답했고**, 학습자의 84%는 학습이 자신의 일에 Purpose를 더한다고 응답했습니다. 또한 변화에 적응하는 데 학습이 도움이 된다고 답한 비율은 2022년 49%에서 **2025년 68%**까지 높아졌습니다.",
              "결국 Career Development 관점에서 HRD의 질문은 ‘어떤 교육을 제공할 것인가?’에서 한 단계 더 나아갈 수 있습니다. **‘이 학습은 구성원의 다음 성장과 어떻게 연결되는가?’** 교육과 커리어가 서로 떨어져 있지 않을 때, 회사가 필요로 하는 Skill 개발과 구성원이 원하는 성장 사이에도 접점을 만들 수 있습니다."
            ],
            "bite_term": "Career Development",
            "bite_definition": "Career Development는 구성원이 현재 역할에 필요한 역량을 개발하는 데서 끝나지 않고, 앞으로 어떤 일을 하고 싶은지 탐색하고 필요한 Skill과 경험을 쌓으며 다음 역할로 성장해가는 과정입니다. 성장의 방식은 승진만이 아니라 Upskilling, Mentoring과 Coaching, Cross-functional Project, Internal Mobility, Career Planning 등 다양할 수 있습니다. 실무적으로는 Where am I?에서 현재 나의 Skill과 경험을 파악하고, Where can I go?에서 앞으로 성장할 수 있는 역할을 살펴본 뒤, What do I need?에서 필요한 Skill을 확인하고, How can I get there?에서 교육과 경험을 연결하는 흐름으로 이해할 수 있습니다. 이 네 질문은 LinkedIn의 공식 Career Development 모델이 아니라 개념을 쉽게 이해하기 위해 정리한 구조입니다.",
            "bite_line": "배움의 이유가 다음 성장과 연결될 때, 교육은 이수해야 할 과정에서 커리어를 움직이는 기회가 될 수 있습니다.",
            "source_name": "LinkedIn Learning",
            "source_title": "2025 Workplace Learning Report: The Rise of Career Champions",
            "source_url": "https://learning.linkedin.com/content/dam/me/learning/en-us/images/lls-workplace-learning-report/2025/full-page/pdfs/LinkedIn-Workplace-Learning-Report-2025.pdf",
            "tags": ["Career Development", "Career Champions", "Internal Mobility", "Workplace Learning"]
          }

          data = [x for x in data if x.get('date') != item['date']]
          data.append(item)
          data.sort(key=lambda x: x['date'])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "daily-hrd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefings.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Sep 15 Career Development briefing"
          git push
