name: Add Sep 16 Briefing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update briefing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/briefings.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          item = {
            "date": "2026-09-16",
            "weekday": "수",
            "category": "Leadership Development",
            "title": "리더교육은 많은데, 왜 리더는 준비되지 않았다고 느낄까?",
            "summary": [
              "팀원이던 사람이 팀장이 되었습니다. 어제까지는 자신의 업무성과를 잘 내는 것이 중요했다면, 오늘부터는 다른 사람에게 방향을 제시하고, 업무를 배분하고, 피드백하고, 갈등을 조율하고, 팀원의 성장을 지원해야 합니다. 직책은 하루 만에 바뀔 수 있지만, **리더로 일하는 Skill까지 하루 만에 생기는 것은 아닙니다.**",
              "글로벌 리더십 전문기관 DDI가 발표한 「Global Leadership Forecast 2025」는 이 간극을 대규모 조사로 보여줍니다. 이번 연구에는 **50개국 이상, 24개 산업의 리더 10,796명과 HR 전문가 2,185명**이 참여했습니다. DDI가 20년 넘게 진행해온 리더십 연구 가운데 최신 조사입니다.",
              "조사에서 가장 눈에 띄는 결과 중 하나는 리더교육에 대한 평가였습니다. 자신이 경험한 Leadership Development를 **‘High Quality’라고 평가한 리더는 26%**에 불과했습니다. 기업들이 리더십 교육을 운영하지 않는다는 의미는 아닙니다. 오히려 리더에게 필요한 역할은 빠르게 바뀌고 있는데, **현재의 개발경험이 그 변화에 충분히 대응하지 못하고 있다고 느끼는 리더가 많다**는 데 가까운 결과입니다.",
              "그렇다면 지금 리더들에게 부족하다고 느껴지는 역량은 무엇일까요? DDI 조사에서 리더들이 꼽은 가장 큰 미래 Skill Gap은 **Setting Strategy와 Managing Change**였습니다. 조직의 방향을 설정하고, 변화 속에서 구성원이 움직일 수 있도록 이끄는 역량입니다. 그런데 HR 조직 가운데 이러한 미래 핵심 Leadership Skill을 실제 육성 우선순위로 두고 있다고 답한 비율은 **22%**였습니다. **리더가 필요하다고 느끼는 역량과 조직이 집중적으로 개발하고 있는 역량 사이에 Gap**이 존재할 수 있다는 것입니다.",
              "왜 이런 문제가 생길까요? 리더십 교육은 종종 직책 변화를 기준으로 시작됩니다. 신임 팀장이 됨 → 신임 팀장 교육 참석 → 과정 수료. 이 자체가 잘못된 것은 아닙니다. 새로운 역할을 맡은 시점에 필요한 기본적인 역할인식과 Skill을 제공하는 것은 중요합니다. 하지만 변화관리, 의사결정, 전략수립, 인재육성처럼 복잡한 Leadership Skill은 **한 번 설명을 들었다고 바로 실제 상황에서 사용할 수 있는 역량이 되기 어렵습니다.**",
              "예를 들어 변화관리 교육에서 ‘변화의 목적을 구성원에게 명확히 설명해야 한다’는 원칙을 배울 수 있습니다. 하지만 실제 팀에서는 새로운 업무방식을 반대하는 팀원도 있고, 왜 바꿔야 하는지 리더 자신도 충분히 납득하지 못할 수 있으며, 변화와 기존 업무를 동시에 수행하느라 팀이 지쳐 있을 수도 있습니다. 결국 리더에게 필요한 것은 **좋은 리더십에 대해 아는 것뿐 아니라, 실제 리더십 상황에서 판단하고 행동해보는 경험**입니다.",
              "DDI도 Leadership Development의 개선 방향으로 이 점을 강조합니다. 좋은 리더교육은 이론 전달에 머무르지 않고 **실제와 가까운 환경에서 Skill을 연습한 뒤 현업에서 사용하고, Feedback을 받아 다시 개선할 수 있어야 한다**고 설명합니다. 또한 리더 개인의 Skill Gap과 역할, 향후 Business Challenge를 반영한 맞춤형 개발이 필요하다고 제안합니다.",
              "즉 ‘모든 팀장에게 같은 교육을 제공한다’에서 한 단계 더 나아가, **‘이 리더가 지금 실제로 어려워하는 Leadership Situation은 무엇인가?’**를 확인하고 필요한 학습경험을 연결할 수 있다는 것입니다. 어떤 리더는 업무 위임이 어려울 수 있고, 누군가는 팀원에게 어려운 Feedback을 전달하는 데 어려움을 느낄 수 있습니다. 또 다른 리더는 현재 팀을 잘 운영하지만 조직의 전략을 팀의 목표로 연결하는 데 어려움을 느낄 수 있습니다. 직급은 같아도 **필요한 개발의 내용은 같지 않을 수 있습니다.**",
              "이 문제가 중요한 이유는 현재 리더들이 느끼는 부담 자체도 상당하기 때문입니다. DDI 조사에서 **71%의 리더가 현재 역할을 맡은 뒤 Stress가 크게 증가했다고 답했고**, 그중 54%는 Burnout을 우려하고 있었습니다. 증가된 Stress를 경험한 리더 가운데 **40%는 Leadership Role 자체를 그만두는 것을 고려한 적이 있다**고 응답했습니다. 동시에 자신의 역할을 충분히 수행할 시간이 있다고 답한 리더는 30%에 불과했습니다.",
              "리더에게 요구되는 것은 늘어나는데, 정작 준비하고 연습할 여유는 충분하지 않은 셈입니다. 이런 모습은 다른 조사에서도 확인됩니다. CIPD의 「Good Work Index 2025」에서 사람을 관리하는 관리자 2,184명 가운데 **직원을 잘 관리하는 데 필요한 Training과 Information을 충분히 받고 있다고 답한 비율은 60%**, 충분한 시간이 있다고 답한 비율은 **59%**였습니다. 2023년보다 개선된 수치지만 여전히 상당수 관리자가 필요한 지원을 충분히 받지 못한다고 느끼고 있습니다.",
              "따라서 리더십 개발을 단순히 교육과정 하나로 보기보다 조금 더 긴 흐름으로 바라볼 수 있습니다. **Assess**에서 지금 리더에게 필요한 Skill과 Gap을 확인하고 → **Learn**에서 필요한 원칙과 방법을 배우고 → **Practice**에서 실제와 비슷한 Leadership Situation에서 연습하고 → **Apply**에서 실제 팀에서 행동으로 사용해보고 → **Feedback & Develop**에서 결과를 Feedback 받고 다음 개발과제로 연결하는 것입니다. 이 다섯 단계는 DDI가 공식적으로 사용하는 하나의 Leadership Development Model이 아니라, DDI 연구에서 강조하는 진단·맞춤화·Practice·현업 적용·지속적 개발의 의미를 HRD 관점에서 이해하기 쉽게 정리한 흐름입니다.",
              "그리고 여기에는 한 가지 중요한 전환이 있습니다. 리더교육의 시작점을 ‘이번에 누가 팀장이 됐는가?’에서만 찾는 것이 아니라, **‘우리 리더들이 앞으로 어떤 상황을 이끌어야 하고, 지금 어떤 Skill이 부족한가?’**에서도 찾는 것입니다.",
              "예를 들어 조직이 대규모 Digital Transformation을 앞두고 있다면 기존의 Coaching이나 Communication 교육을 반복하는 것만으로 충분하지 않을 수 있습니다. 새로운 전략을 팀의 업무로 구체화하고, 변화의 이유를 설명하고, 구성원의 저항과 불안을 다루며, 변화 속에서도 Performance를 유지하는 Skill이 더 시급할 수 있기 때문입니다.",
              "DDI 역시 앞으로 **5년 이내 새로운 Leadership Capability가 필요해질 것이라고 예상한 HR 조직이 83%**라고 보고했습니다. 리더의 역할이 변하고 있다면 리더교육도 과거에 정해놓은 Curriculum을 반복하기보다 변화하는 Business와 Leadership Challenge를 계속 반영할 필요가 있습니다.",
              "물론 DDI는 Leadership Consulting과 교육사업을 제공하는 기업이기 때문에, Leadership Development의 필요성을 강조하는 자료를 해석할 때는 이런 출처 특성을 고려할 필요가 있습니다. 또한 이번 결과 역시 ‘특정 리더교육을 실시하면 Stress가 감소한다’는 식의 직접적인 인과효과를 검증한 실험은 아닙니다. 그럼에도 **10,000명이 넘는 글로벌 리더가 실제 역할에서 느끼는 개발 Gap과 부담을 보여준 대규모 조사**라는 점에서 HRD가 리더육성을 설계할 때 참고할 만한 자료입니다.",
              "결국 리더십 개발의 목표는 **‘리더교육을 이수한 사람’을 만드는 것이 아니라, 실제 Leadership Situation에서 필요한 행동을 할 수 있는 사람을 만드는 것**에 더 가깝습니다. 그래서 다음 리더교육을 준비할 때는 ‘리더에게 무엇을 가르칠까?’와 함께, **‘우리 리더가 앞으로 어떤 상황을 잘 이끌 수 있어야 하는가?’**를 먼저 물어볼 수 있습니다. 직책을 부여하는 순간이 리더 육성의 끝이 아니라, **새로운 역할을 제대로 수행하도록 계속 준비시키는 과정의 시작**일 수 있습니다."
            ],
            "bite_term": "Leadership Development",
            "bite_definition": "Leadership Development는 단순히 팀장이나 임원에게 Leadership 이론을 교육하는 것을 넘어, 현재와 미래의 리더가 사람과 조직을 효과적으로 이끌 수 있도록 필요한 Skill·행동·경험을 지속적으로 개발하는 과정입니다. 리더십 개발에서는 직급과 역량을 구분해서 볼 필요가 있습니다. Position은 조직이 부여하는 팀장·임원 등의 공식적인 역할이고, Capability는 그 역할을 실제로 수행하는 데 필요한 Skill과 행동입니다. 팀장이 됐다고 해서 Coaching, Delegation, Decision Making, Change Leadership 같은 Capability가 자동으로 생기는 것은 아닙니다. 실무적으로는 Role에서 새로운 역할에 무엇이 요구되는지 확인하고 → Gap에서 현재 부족한 역량을 찾고 → Practice에서 안전한 환경에서 행동을 연습하고 → Experience에서 실제 업무에서 경험하며 → Growth에서 Feedback을 통해 계속 성장하는 흐름으로 이해할 수 있습니다. Role → Gap → Practice → Experience → Growth는 특정 기관의 공식 모델이 아니라 Leadership Development의 의미를 쉽게 이해하기 위한 실무적 구조입니다.",
            "bite_line": "리더가 되는 것은 발령으로 가능하지만, 리더로 성장하는 것은 개발이 필요합니다.",
            "source_name": "DDI",
            "source_title": "Global Leadership Forecast 2025",
            "source_url": "https://www.ddi.com/research/global-leadership-forecast-2025",
            "sources": [
              {
                "name": "DDI",
                "title": "Global Leadership Forecast 2025",
                "url": "https://www.ddi.com/research/global-leadership-forecast-2025"
              },
              {
                "name": "CIPD",
                "title": "Good Work Index 2025",
                "url": "https://www.cipd.org/globalassets/media/knowledge/knowledge-hub/reports/2025-pdfs/2025-good-work-index-8868.pdf"
              }
            ],
            "tags": ["Leadership Development", "Leadership Skill", "Manager Development", "HRD"]
          }

          data = [x for x in data if x.get('date') != item['date']]
          data.append(item)
          data.sort(key=lambda x: x['date'])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "daily-hrd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefings.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Sep 16 Leadership Development briefing"
          git push
